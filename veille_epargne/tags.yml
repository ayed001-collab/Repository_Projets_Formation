# =============================================================================
# Règles de tags — détection par mots-clés (titre + résumé)
# -----------------------------------------------------------------------------
# Chaque tag est appliqué à un article si l'un de ses mots-clés apparaît
# (recherche insensible à la casse et aux accents). Un article peut cumuler
# plusieurs tags. Ajoutez / retirez des tags et mots-clés librement.
#
# Les mots-clés de "indices_domaine" servent à re-classer les articles des
# sources "transverse" en "assurance" ou "banque".
# =============================================================================

