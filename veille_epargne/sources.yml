# =============================================================================
# Sources de veille — Épargne / Assurance / Banque en France
# -----------------------------------------------------------------------------
# Chaque source expose un ou plusieurs flux RSS/Atom.
#
#   domaine : "assurance" | "banque" | "transverse"
#             -> les sources "transverse" (régulateurs, presse patrimoniale,
#                administration) sont re-classées article par article selon
#                les mots-clés du titre/résumé.
#   actif   : true/false pour activer/désactiver une source sans la supprimer.
#   flux    : URL du flux RSS/Atom.
#
# NB : les URLs de flux évoluent parfois. L'application ignore proprement un
# flux injoignable (avertissement en log). Vérifiez/ajustez les URLs via les
# pages "flux RSS" de chaque éditeur (voir README, section "Vérifier les flux").
# =============================================================================

# Mots-clés déterminant qu'un article concerne bien l'épargne / le placement.
# Un article est retenu s'il contient AU MOINS un de ces termes
# (dans le titre ou le résumé). Laisser vide pour tout conserver.
pertinence:
  - épargne
  - epargne
  - placement
  - placements
  - assurance-vie
  - assurance vie
  - fonds euros
  - fonds en euros
  - unités de compte
  - unite de compte
  - per
  - plan d'épargne retraite
  - épargne retraite
  - retraite
  - livret a
  - ldds
  - lep
  - livret
  - pea
  - peac
  - scpi
  - opci
  - pierre-papier
  - obligations
  - bon de capitalisation
  - contrat de capitalisation
  - taux
  - rendement
  - rémunération
  - fiscalité
  - fiscalite
  - défiscalisation
  - patrimoine
  - collecte
  - encours
  - flat tax
  - pfu
  - prélèvement forfaitaire
  - crypto
  - cryptomonnaie
  - actif numérique
  - actifs numériques
  - bitcoin
  - sofica
  - lingot
  - métaux précieux

